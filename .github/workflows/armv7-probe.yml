name: ARMv7 probe

# Manual only, deliberately. This is an experiment, not a gate: it compiles the
# Node.js runtime for android-arm, which costs 40-70 minutes. Putting that on every
# push would make CI useless for the work it actually guards.
#
# The question this answers: can OpenCode's engine ever run on a 32-bit-only phone?
# The engine is a Bun-compiled binary, and Bun has no 32-bit ARM target at all
# (issue #5060, closed as "not planned"). The only remaining route is Node's
# `android-configure`, which does accept `arm`. This workflow finds out whether
# that route produces something real, before anyone spends weeks on it.
on:
  workflow_dispatch:

jobs:
  node-armv7:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      NODE_VERSION: "26.4.0"
      # The NDK the Android build already uses. Alignment and libc availability are
      # decided by this, not by flags (handoff.md §2.32).
      NDK_VERSION: "29.0.13113456"
      ANDROID_API: "29"

    steps:
      - uses: actions/checkout@v4

      - name: Install NDK
        run: |
          sdkmanager="$(command -v sdkmanager || echo "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tr ' ' '\n' | head -1)"
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;$NDK_VERSION" | tail -2
          echo "NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3 qemu-user xz-utils ccache
          echo "qemu: $(qemu-arm --version | head -1)"

      - name: Fetch Node source
        run: |
          curl --fail --silent --show-error --location \
            "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION.tar.xz" \
            --output node.tar.xz
          echo "downloaded $(du -h node.tar.xz | cut -f1)"
          tar -xf node.tar.xz
          echo "SRC=$PWD/node-v$NODE_VERSION" >> "$GITHUB_ENV"

      # android-configure refuses to run on anything but Linux or Darwin, which is
      # exactly why this job exists: this machine cannot do it.
      - name: Configure for android-arm
        working-directory: ${{ github.workspace }}/node-v${{ env.NODE_VERSION }}
        run: |
          ./android-configure "$NDK_ROOT" "$ANDROID_API" arm 2>&1 | tail -30
          echo "--- configure result ---"
          # config.gypi holds the variables that actually drive the build. Checking
          # them is the difference between "the script printed Info: Configuring"
          # and "the build is really targeting arm".
          python3 - <<'PY'
          import ast, sys
          raw = open('config.gypi', encoding='utf-8').read()
          cfg = ast.literal_eval(raw)['variables']
          want = {
              'target_arch': 'arm',
              'v8_target_arch': 'arm',
              'host_os': 'linux',
              'OS': 'android',
          }
          bad = {k: cfg.get(k) for k, v in want.items() if cfg.get(k) != v}
          for k, v in want.items():
              print(f'{k} = {cfg.get(k)!r} (want {v!r})')
          if bad:
              print('FAIL: configure did not target android-arm:', bad, file=sys.stderr)
              sys.exit(1)
          PY

      # The expensive step. The compiler paths are re-derived rather than inherited:
      # `android_configure.py` sets CC/CXX in its own process only, so nothing
      # survives into this step. Writing `CC="ccache $CC"` against an empty $CC
      # would produce `CC="ccache "` and break the build in a confusing way.
      #
      # ccache is on because a re-run after a late failure should not start from
      # zero; this build takes 40-70 minutes.
      - name: Build node (this is the 40-70 minute step)
        working-directory: ${{ github.workspace }}/node-v${{ env.NODE_VERSION }}
        run: |
          tc="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="ccache $tc/armv7a-linux-androideabi$ANDROID_API-clang"
          export CXX="ccache $tc/armv7a-linux-androideabi$ANDROID_API-clang++"
          export CCACHE_DIR="$HOME/.ccache"
          echo "CC=$CC"
          make -j"$(nproc)" 2>&1 | tail -40

      - name: Verify the ELF is really 32-bit Android ARM
        run: |
          node_bin="${{ github.workspace }}/node-v${{ env.NODE_VERSION }}/out/Release/node"
          test -f "$node_bin" || { echo "no binary at $node_bin" >&2; exit 1; }
          echo "size: $(du -h "$node_bin" | cut -f1)"
          python3 - "$node_bin" <<'PY'
          import struct, sys
          d = open(sys.argv[1], 'rb').read(64)
          assert d[:4] == b'\x7fELF', 'not an ELF'
          cls, machine = d[4], struct.unpack_from('<H', d, 18)[0]
          etype = struct.unpack_from('<H', d, 16)[0]
          print(f'class={cls} (1=32-bit) machine=0x{machine:02x} type={etype}')
          ok = True
          if cls != 1:
              print('FAIL: not 32-bit'); ok = False
          if machine != 0x28:
              print('FAIL: not ARM (0x28)'); ok = False
          if etype != 3:
              # ET_EXEC would still be loadable, but ET_DYN is what Android wants.
              print(f'NOTE: e_type={etype}, Android prefers ET_DYN (3) for PIE')
          sys.exit(0 if ok else 1)
          PY

      - name: Verify the interpreter is bionic, not glibc
        run: |
          node_bin="${{ github.workspace }}/node-v${{ env.NODE_VERSION }}/out/Release/node"
          readelf -l "$node_bin" | grep -A1 'INTERP' || true
          interp=$(readelf -l "$node_bin" | grep -o '/system/bin/linker[^ ]*' | head -1)
          if [ -z "$interp" ]; then
            echo "FAIL: no /system/bin/linker interpreter — this is a glibc binary" >&2
            echo "A glibc interpreter (/lib/ld-linux-armhf.so.3) can never load on Android." >&2
            exit 1
          fi
          echo "interpreter: $interp"

      # A binary that builds but calls symbols bionic does not have will link fine
      # and die at first use. This compares every undefined symbol against the
      # API-29 stub libraries the NDK ships.
      - name: Check undefined symbols against bionic ${{ env.ANDROID_API }}
        run: |
          node_bin="${{ github.workspace }}/node-v${{ env.NODE_VERSION }}/out/Release/node"
          libdir="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/$ANDROID_API"
          nm_tool="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"

          "$nm_tool" -D --undefined-only "$node_bin" | awk '{print $NF}' | sed 's/@.*//' | sort -u > /tmp/undef.txt
          : > /tmp/avail.txt
          for lib in "$libdir"/libc.so "$libdir"/libdl.so "$libdir"/libm.so \
                     "$libdir"/liblog.so "$libdir"/libz.so "$libdir"/libc++.so; do
            [ -f "$lib" ] || continue
            "$nm_tool" -D --defined-only "$lib" 2>/dev/null | awk '{print $NF}' | sed 's/@.*//' >> /tmp/avail.txt
          done
          sort -u /tmp/avail.txt -o /tmp/avail.txt

          echo "undefined: $(wc -l < /tmp/undef.txt), available in bionic: $(wc -l < /tmp/avail.txt)"
          missing=$(comm -23 /tmp/undef.txt /tmp/avail.txt | grep -v '^$' || true)
          if [ -n "$missing" ]; then
            echo "--- symbols not provided by bionic API $ANDROID_API ---" >&2
            echo "$missing" >&2
            echo "These would fail at runtime, not at link time." >&2
            exit 1
          fi
          echo "all undefined symbols resolve against bionic"

      # Best effort, and labelled as such. The NDK ships stub libraries for linking,
      # not a real libc, and contains no `linker`. So qemu-arm cannot be given a
      # faithful bionic here. What this step proves is narrower: that qemu can map
      # and begin executing the image. A failure here is NOT proof the binary is
      # broken, and a success is NOT proof it runs on a phone.
      - name: Attempt to start it under qemu-arm (approximate, see comment)
        continue-on-error: true
        run: |
          node_bin="${{ github.workspace }}/node-v${{ env.NODE_VERSION }}/out/Release/node"
          sysroot="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/$ANDROID_API"
          timeout 60 qemu-arm -L "$sysroot" "$node_bin" -e 'console.log(process.version, process.arch)' 2>&1 | tail -20 || {
            echo "qemu could not start it. Expected: the NDK provides stub libs and no linker."
            echo "This does not by itself mean the binary is unusable on a real device."
          }

      - name: Upload the binary and findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-armv7-${{ env.NODE_VERSION }}
          path: |
            ${{ github.workspace }}/node-v${{ env.NODE_VERSION }}/out/Release/node
          if-no-files-found: warn
          retention-days: 7
